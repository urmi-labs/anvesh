# Anvesh sources. Copy this file to your private data repo as sources.yaml.
#
# adapter:   rss | json_api | google_news
# status:    documented = in the provider's docs; verified = checked by hand;
#            confirm = from memory or a directory, run `anvesh check-sources` before trusting it
# priority:  P1 goes live first, P2 and P3 later
# needs:     environment variables (secrets) the source cannot run without
# lag_hours: the source publishes late, so its 24-hour limit is widened by this much
# kind:      funding (default; goes through the funding filter to the digest) | job | launch
#            (job and launch are fetched and counted but held back until the role filter exists)
# items, fields: json_api only. items = dotted path to the record list ("" = the reply is the list);
#            fields maps title / link or link_template / company / published / summary to the API's
#            own keys. published must be the POSTED date, never an updated or modified field.
#
# Careful: YAML reads bare words like on, off, yes, no as true/false. Quote them if you mean text.

sources:
  # ---------- Funding news: India ----------
  - name: inc42
    adapter: rss
    url: "https://inc42.com/feed/"
    region: IN
    status: documented

  - name: inc42_buzz
    adapter: rss
    url: "https://inc42.com/buzz/feed/"
    region: IN
    status: documented

  - name: yourstory
    adapter: rss
    url: "https://yourstory.com/feed"
    region: IN
    status: documented

  - name: startuptalky
    adapter: rss
    url: "https://startuptalky.com/rss/"
    region: IN

  - name: entrackr
    adapter: google_news
    query: "site:entrackr.com (raises OR funding)"
    regions: [IN]
    region: IN
    notes: "Entrackr's own feed URL is not confirmed, so read it through Google News"

  - name: ettech
    adapter: google_news
    query: "site:economictimes.indiatimes.com/tech (raises OR funding)"
    regions: [IN]
    region: IN

  - name: moneycontrol_startups
    adapter: google_news
    query: "site:moneycontrol.com (startup raises OR funding round)"
    regions: [IN]
    region: IN

  # ---------- Funding news: global ----------
  - name: techcrunch
    adapter: rss
    url: "https://techcrunch.com/feed/"
    region: GLOBAL
    status: documented

  - name: crunchbase_news
    adapter: rss
    url: "https://news.crunchbase.com/feed/"
    region: GLOBAL

  - name: finsmes
    adapter: google_news
    query: "site:finsmes.com raises"
    regions: [US]
    region: GLOBAL
    notes: "Direct feed returns 403 to non-browser clients (checked 2026-11-27); read through Google News"

  - name: eu_startups
    adapter: google_news
    query: "site:eu-startups.com raises"
    regions: [GB]
    region: EU
    notes: "Direct feed works from home but returns 403 from GitHub Actions (2026-11-28); read through Google News"

  - name: silicon_republic
    adapter: rss
    url: "https://www.siliconrepublic.com/category/start-ups/feed/"
    region: EU
    status: documented

  # ---------- Funding news: infra-focused ----------
  - name: siliconangle
    adapter: rss
    url: "https://siliconangle.com/feed/"
    region: GLOBAL

  - name: devops_com
    adapter: google_news
    query: "site:devops.com (raises OR funding OR series)"
    regions: [US]
    region: GLOBAL
    notes: "Direct feed returns 403 to non-browser clients (checked 2026-11-27); read through Google News"

  - name: the_new_stack
    adapter: rss
    url: "https://thenewstack.io/feed/"
    region: GLOBAL

  # ---------- Google News funding search, one feed per region ----------
  - name: gnews_funding
    adapter: google_news
    query: '(raises OR raised OR secures OR bags) (seed OR "pre-series" OR "series a" OR "series b") startup'
    regions: [IN, US, GB, SG]
    region: GLOBAL
    status: documented
    notes: "Item links are Google redirects; use title and publisher only"

  # ---------- Structured data ----------
  - name: yc_hiring
    adapter: json_api
    url: "https://yc-oss.github.io/api/companies/hiring.json"
    region: GLOBAL
    status: documented
    enabled: false
    notes: "Unofficial, rebuilt daily. A company list, not posts: needs a diff against yesterday's list (later phase)"

  - name: hn_whoishiring
    adapter: json_api
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring"
    region: GLOBAL
    status: documented
    enabled: false
    notes: "Finds the monthly thread; the jobs are its comments, which need their own adapter (later phase)"

  - name: sec_formd
    adapter: json_api
    url: "https://efts.sec.gov/LATEST/search-index?q=&forms=D"
    region: US
    priority: P2
    enabled: false
    needs: [RADAR_CONTACT]
    notes: "403 with our User-Agent on 2026-11-27 even with contact set; fix the User-Agent format in Phase 4"

  # ---------- Job boards ----------
  - name: remoteok
    adapter: json_api
    url: "https://remoteok.com/api"
    region: REMOTE
    status: documented
    lag_hours: 24
    kind: job
    items: ""                     # the reply is a list; record 0 is a legal notice and is skipped
    fields: {title: position, company: company, link: url, published: date, summary: description}
    notes: "Credit Remote OK and link back to each listing"

  - name: jobicy
    adapter: json_api
    url: "https://jobicy.com/api/v2/remote-jobs"
    region: REMOTE
    min_interval_minutes: 60
    kind: job
    items: jobs
    fields: {title: jobTitle, company: companyName, link: url, published: pubDate, summary: jobExcerpt}
    notes: "At most one check an hour, keep attribution"

  - name: arbeitnow
    adapter: json_api
    url: "https://www.arbeitnow.com/api/job-board-api"
    region: EU
    status: documented
    kind: job
    items: data
    fields: {title: title, company: company_name, link: url, published: created_at, summary: description}
    notes: "visa_sponsorship=true parameter reportedly does not filter; detect from text"

  - name: arbeitnow_uk
    adapter: json_api
    url: "https://www.arbeitnow.co.uk/api/job-board-api"
    region: GB
    status: documented
    kind: job
    items: data
    fields: {title: title, company: company_name, link: url, published: created_at, summary: description}

  - name: wwr_devops
    adapter: rss
    url: "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
    region: REMOTE
    kind: job
    notes: "Example category. Swap the URL for the WWR category that matches your role"

  - name: hn_jobs
    adapter: json_api
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=job"
    region: GLOBAL
    kind: job
    items: hits
    fields: {title: title, link_template: "https://news.ycombinator.com/item?id={objectID}", published: created_at, summary: story_text}
    notes: "Job ads posted directly on Hacker News, mostly by YC startups"

  - name: hn_launches
    adapter: json_api
    url: "https://hn.algolia.com/api/v1/search_by_date?query=%22Launch%20HN%22&tags=story&restrictSearchableAttributes=title"
    region: GLOBAL
    kind: launch
    items: hits
    fields: {title: title, link_template: "https://news.ycombinator.com/item?id={objectID}", published: created_at, summary: story_text}
    notes: "YC startups announcing launch, often near their seed round; a funded-no-job-post signal"
