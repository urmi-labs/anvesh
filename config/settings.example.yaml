# Anvesh settings. Copy this file to your private data repo as settings.yaml.
# Every value below is the default, so you only need to keep the lines you change.
# A missing or empty settings.yaml means "use all defaults".

http:
  timeout_seconds: 15              # give up on a request after this long
  retries: 2                       # extra attempts after the first one fails
  backoff_seconds: [2, 5]          # wait before retry 1, retry 2, ... (need one value per retry)
  max_retry_after_seconds: 30      # never wait longer than this when a server says Retry-After
  min_interval_per_host_seconds: 1.0   # politeness gap between two requests to the same site
  project_url: "https://github.com/urmi-labs/anvesh"   # shown in the User-Agent; forks set their own
  contact: ""                      # email shown in the User-Agent; empty = use the RADAR_CONTACT env var

state:
  retention_days: 120              # forget records not seen for this many days

google_news:
  language: en                     # interface language for google_news sources (en, de, hi, ...)

digest:
  # The Telegram message with each run's new stories. Headlines are links, so long URLs never show.
  header: "Anvesh: {new} newly funded startups"   # placeholders: {new} {stories} {fetched} {sources}
  group_by_region: true            # a bold region line (IN, GLOBAL, EU ...) before its stories
  region_order: [IN, REMOTE, GLOBAL, US, EU, UK]   # regions not listed come after these, A-Z
  show_sources: true               # "inc42 +2" after each headline: who reported it, and how many others
  max_stories: null                # null = send all; a number holds the rest back for the next run
  send_when_empty: false           # true = send the header even when nothing is new (a heartbeat)
